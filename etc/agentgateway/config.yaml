# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
- port: @gatewayPort@
  address: 0.0.0.0
listeners:
- routes:
  - backends:
    - mcp:
        targets:
        - name: context7
          mcp:
            host: http://context7:@context7Port@/mcp
        - name: playwright
          mcp:
            host: http://playwright:@playwrightPort@/mcp
@accountTargets@
        - name: memory
          mcp:
            host: http://agentmemory:@agentmemoryHttpPort@/mcp
        - name: searxng-mcp
          mcp:
            host: http://searxng-mcp:@searxngMcpPort@/mcp
        - name: crawl4ai
          mcp:
            host: http://crawl4ai:@crawl4aiPort@/mcp/sse
        - name: probe-mcp
          mcp:
            host: http://probe-mcp:@probeMcpPort@/mcp
