personality = "pragmatic"
commit_attribution = ""

model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"

review_model = "@codexModel@"

[agents]
default_subagent_model = "@codexModel@"
default_subagent_reasoning_effort = "xhigh"

[[skills.config]]
path = "@homeDir@/.codex/skills/.system/skill-creator"
enabled = false

# agentmemory lifecycle hooks、upstream hooks.codex.json と同じ 6 event
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-session-start"
statusMessage = "agentmemory: loading session context"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-prompt-submit"

[[hooks.PreToolUse]]
matcher = "Edit|Write|Read|Glob|Grep"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-pre-tool-use"

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-post-tool-use"

[[hooks.PreCompact]]
[[hooks.PreCompact.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-pre-compact"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/run/current-system/sw/bin/agentmemory-hook-stop"
