# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
- port: @gatewayPort@
  listeners:
  - routes:
    - backends:
      - mcp:
          targets:
          - name: context7
            mcp:
              host: http://context7:@context7Port@/mcp
          - name: playwright
            mcp:
              host: http://playwright:@playwrightPort@/mcp
@accountTargets@
          - name: searxng-mcp
            mcp:
              host: http://searxng-mcp:@searxngMcpPort@/mcp
          - name: crawl4ai
            mcp:
              host: http://crawl4ai-mcp:@crawl4aiMcpPort@/mcp
          - name: probe-mcp
            mcp:
              host: http://probe-mcp:@probeMcpPort@/mcp
