name: Compare upstream versions

on:
  workflow_dispatch:
  schedule:
    - cron: '19 1 * * 1'

permissions:
  contents: read

jobs:
  upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compare pinned sources without installing them
        run: python3 maintenance/upstreams/check.py
