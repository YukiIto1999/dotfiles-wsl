personality = "pragmatic"
commit_attribution = ""

model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"

review_model = "@codexModel@"

[[skills.config]]
path = "@homeDir@/.codex/skills/.system/skill-creator"
enabled = false

# Project memory lifecycle hooks.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "/run/current-system/sw/bin/dotfiles-memory hook --harness codex session-start"
statusMessage = "project-memory: loading session context"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "/run/current-system/sw/bin/dotfiles-memory hook --harness codex prompt-submit"

[[hooks.PreCompact]]
[[hooks.PreCompact.hooks]]
type = "command"
command = "/run/current-system/sw/bin/dotfiles-memory hook --harness codex pre-compact"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "/run/current-system/sw/bin/dotfiles-memory hook --harness codex stop"
