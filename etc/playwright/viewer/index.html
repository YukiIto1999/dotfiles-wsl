<!doctype html>
<meta charset="utf-8">
<title>Playwright</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #screencast { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #statusBar { position: fixed; top: 8px; left: 8px; padding: 4px 8px; border-radius: 4px;
               color: #999; background: #000a; font: 12px system-ui; }
  #keyboardCapture { position: fixed; top: 0; left: 0; width: 1px; height: 1px;
                     opacity: 0; border: 0; padding: 0; pointer-events: none; }
</style>
<img id="screencast" alt="">
<textarea id="keyboardCapture" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="statusBar">connecting…</div>
<script src="/client.js"></script>
